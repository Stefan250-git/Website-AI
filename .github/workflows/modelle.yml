# Aktualisiert die Modell-Ranglisten (assets/data/modelle.js) aus dem Arena-Leaderboard.
# Auf Abruf: GitHub → Actions → „Modelle aktualisieren“ → „Run workflow“.
name: Modelle aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 07:17 Uhr MESZ

permissions:
  contents: write

concurrency:
  group: modelle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Bausteine auf feste, geprüfte Versionen festgelegt (Commit-Kennung statt verschiebbarer Versionsmarke):
      # eine manipulierte neue Version kann so nichts in die Website schreiben. Aktualisieren: Kennung von v4/v5 neu eintragen.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Abhängigkeit installieren
        run: pip install --only-binary=:all: pyarrow==26.0.1

      - name: Leaderboard abrufen
        run: python scripts/update_models.py

      - name: Änderungen übernehmen
        run: |
          if git diff --quiet -- assets/data/modelle.js; then
            echo "Keine neuen Daten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/modelle.js
          git commit -m "Modell-Ranglisten aktualisiert"
          git push
